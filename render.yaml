databases:
  - name: survitec-db
    plan: free

services:
  - type: web
    name: survitec-backend
    runtime: python
    rootDir: task_management_system
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask db upgrade && gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/v1/health
    envVars:
      - key: FLASK_APP
        value: app.py
      - key: DATABASE_URL
        fromDatabase:
          name: survitec-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRES_MINUTES
        value: "60"
      - key: JWT_REFRESH_TOKEN_EXPIRES_DAYS
        value: "30"
      # Comma-separate additional origins here if you add a custom
      # domain later.
      - key: CORS_ORIGINS
        value: https://survitec-x-dahawi.vercel.app
      # Set these in the Render dashboard (Environment tab) instead of
      # here — real account credentials should never be committed.
      # One account per role that cannot be created from inside the app:
      # the Super Admin, the central Operational Manager, and HR. Everyone
      # else is created through User Management.
      #
      # REQUIRED, not optional. create_seed_accounts() skips any seed whose
      # email or password is blank, and it does so silently — so leaving
      # these unset produces a database with no users at all, and every
      # login correctly answers "Invalid email or password" with nothing in
      # the logs to explain why. If nobody can sign in to a fresh deploy,
      # check these first.
      #
      # The accounts are matched by employee number (SA001/OM001/HR001), so
      # changing an address here and redeploying moves that account to the
      # new address — look for "Moved SA001 from … to …" in the deploy log.
      # The passwords are only read when the account is first created;
      # changing one here never resets an account that already exists.
      - key: SEED_SUPER_ADMIN_EMAIL
        sync: false
      - key: SEED_SUPER_ADMIN_PASSWORD
        sync: false
      - key: SEED_MANAGER_EMAIL
        sync: false
      - key: SEED_MANAGER_PASSWORD
        sync: false
      - key: SEED_HR_EMAIL
        sync: false
      - key: SEED_HR_PASSWORD
        sync: false
      # Outbound email.
      #
      # SMTP DOES NOT WORK FROM HERE. A connect to port 587 from this
      # service times out at the network level — "TimeoutError: [Errno 110]
      # Connection timed out" — because the free tier blocks outbound SMTP.
      # The same credentials connect in under two seconds from a developer
      # machine, so this is a property of the host, not of the mailbox or
      # the code. Do not spend time re-testing MAIL_* here; it cannot work.
      #
      # Mail therefore leaves over HTTPS via Resend. Set RESEND_API_KEY in
      # the dashboard, and keep MAIL_DEFAULT_SENDER as the From address —
      # it must be at a domain verified in the Resend account, or every
      # send comes back 403 with "domain is not verified".
      #
      # Check /api/v1/health after any change: mail_transport says which
      # path is active, and last_mail_delivery carries the outcome of the
      # most recent send with the provider's own error text.
      - key: RESEND_API_KEY
        sync: false
      # The MAIL_* block below is the local-development transport, kept as
      # the fallback when RESEND_API_KEY is absent. Leaving both unset does
      # not error: EmailService logs each message to the service log
      # instead, so the failure mode is silent — password-reset tokens
      # never arrive, and neither do task or leave notifications.
      # Port 587 is STARTTLS, so USE_TLS true / USE_SSL false.
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "True"
      - key: MAIL_USE_SSL
        value: "False"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
